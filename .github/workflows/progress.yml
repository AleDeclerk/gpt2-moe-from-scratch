name: Measure progress

# The website shows the number of tests that pass. This workflow makes that
# number true after every push, without a manual step.
on:
  push:
    branches: [main]
    paths:
      - "chapters/**"
      - "gpt2moe/**"
      - "scripts/sync_progress.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the test environment
        run: |
          uv venv --python 3.13
          # The CPU build of PyTorch is much smaller than the default one, and
          # the tests of this course do not need a GPU.
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install pytest numpy tiktoken

      - name: Measure the progress
        run: uv run python scripts/sync_progress.py

      - name: Commit the result, if it changed
        run: |
          if git diff --quiet progress.json; then
            echo "No change in progress.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git commit -m "Update the measured progress [skip ci]"
          git push
