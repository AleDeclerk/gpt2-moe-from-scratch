name: Medir el progreso

# El sitio muestra la cantidad de tests que pasan. Este workflow hace que ese
# número sea cierto después de cada push, sin ningún paso manual.
on:
  push:
    branches: [main]
    paths:
      - "chapters/**"
      - "gpt2moe/**"
      - "scripts/sync_progress.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar el entorno de tests
        run: |
          uv venv --python 3.13
          # El build de CPU de PyTorch es mucho más chico que el que viene por
          # defecto, y los tests de este curso no necesitan GPU.
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install pytest numpy tiktoken

      - name: Medir el progreso
        run: uv run python scripts/sync_progress.py

      - name: Commitear el resultado, si cambió
        run: |
          if git diff --quiet progress.json; then
            echo "Sin cambios en progress.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git commit -m "Actualiza el progreso medido [skip ci]"
          git push
